[project]
name = "studypilot"
version = "0.1.0"
description = "AI-powered learning platform"
requires-python = ">=3.11"
authors = [{name = "PrincePandit16"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[bcrypt]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.12",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.0.0",
    "sentence-transformers>=2.3.0",
    "pymupdf>=1.24.0",
    "gradio>=5.0.0",
    "email-validator>=2.3.0",
    "argon2-cffi>=25.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
]
